@if (!friend()) {

<div class="empty">
    Seleccioná un amigo para comenzar a chatear
</div>

} @else {

<div class="chat">

    <div class="messages">

        @for (m of messages(); track m.id) {

        <div class="message" [class.mine]="isMine(m)">

            {{ m.content }}

        </div>

        }

    </div>

    <div class="input-box">

        <input [formControl]="messageControl" placeholder="Escribí un mensaje..."
            (keydown.enter)="send(); $event.preventDefault()" />

        <button (click)="send()" [disabled]="messageControl.invalid">
            Enviar
        </button>
        @if (messageControl.touched && messageControl.hasError('whitespace')) {
        <small class="error">El mensaje no puede estar vacío.</small>
        }

    </div>

</div>

}
