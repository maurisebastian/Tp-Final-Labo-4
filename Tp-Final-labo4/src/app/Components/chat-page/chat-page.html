<div class="chat-container">

  <!-- SIDEBAR -->
  <div class="sidebar">

    <h3>Amigos</h3>

    @for (friend of friends(); track friend.id) {

      <div class="friend-item"
           (click)="selectFriend(friend)"
           [class.active]="selectedFriend()?.id === friend.id">

        <img
          class="avatar"
          [src]="friend.avatarUrl || 'assets/perfil.png'"
        />

        <div class="info">
          <div class="name">{{ friend.username }}</div>
          <div class="bio">
            {{ friend.bio || 'Sin descripción' }}
          </div>
        </div>

      </div>
    }

  </div>


  <!-- CHAT WINDOW -->
  <div class="chat-window">

    @if (!selectedFriend()) {

      <div class="empty-chat">
        Seleccioná un amigo para comenzar a chatear
      </div>

    } @else {

      <div class="chat-header">
        <img
          class="avatar"
          [src]="selectedFriend()?.avatarUrl || 'assets/perfil.png'"
        />
        <span>{{ selectedFriend()?.username }}</span>
      </div>

      <!-- componente de mensajes -->
      <div class="chat-body">
        <app-chat-window [friend]="selectedFriend()">
        </app-chat-window>
      </div>

    }

  </div>

</div>
